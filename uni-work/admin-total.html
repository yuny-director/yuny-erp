<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YUNY_ERP - 유니 종합 마스터 정산 원장표</title>
    <style>
        html { margin: 0; padding: 0; background-color: #f4f6f9; font-family: Arial, sans-serif; }
        body { margin: 0; padding: 0; padding-top: 65px !important; background-color: #f4f6f9; font-family: Arial, sans-serif; }

        .content { padding: 15px; }
        .card { background-color: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .flex-form-row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; margin-bottom: 15px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { margin-bottom: 6px; font-weight: bold; font-size: 13px; color: #333; }
        .form-group input, .form-group select { padding: 0 10px; border: 1px solid #ccc; border-radius: 4px; height: 38px; box-sizing: border-box; font-size: 13px; background-color: #ffffff; }

        .btn { padding: 0 16px; background-color: #1abc9c; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; height: 38px; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; transition: background 0.2s; box-sizing: border-box; }
        .btn:hover { background-color: #16a085; }
        .btn-purple { background-color: #9b59b6 !important; }
        .btn-orange { background-color: #e67e22 !important; }
        .btn-danger { background-color: #e74c3c !important; }
        .btn-teal { background-color: #00796b !important; }

        /* 🎯 유니 종합 마스터 테이블 스타일 (원본 100% 레이아웃) */
        .table-container { width: 100%; max-height: 72vh; overflow: auto !important; border: 1px solid #ccc; border-radius: 6px; background: white; -webkit-overflow-scrolling: touch; }
        table { border-collapse: separate !important; border-spacing: 0 !important; font-size: 12px; width: auto; min-width: 100%; table-layout: fixed; }
        th, td { padding: 7px 5px; text-align: center; white-space: nowrap; box-sizing: border-box; border-right: 1px solid #ddd !important; border-bottom: 1px solid #ddd !important; transition: background-color 0.15s ease; }
        th { background-color: #f8f9fa !important; font-weight: bold; position: sticky !important; top: 0 !important; z-index: 30 !important; }

        /* 좌측 고정 열 */
        .fix-col-1 { position: sticky !important; left: 0px !important; min-width: 75px; max-width: 85px; background: #ffffff !important; z-index: 10; font-weight: bold; }
        .fix-col-2 { position: sticky !important; left: 75px !important; min-width: 75px; max-width: 85px; background: #ffffff !important; z-index: 10; font-weight: bold; }
        .fix-col-3 { position: sticky !important; left: 150px !important; min-width: 90px; max-width: 110px; background: #fafafa !important; z-index: 10; }
        .fix-col-4 { position: sticky !important; left: 240px !important; min-width: 65px; max-width: 75px; background: #fafafa !important; z-index: 10; }
        .fix-col-5 { position: sticky !important; left: 305px !important; min-width: 70px; max-width: 80px; background: #fafafa !important; z-index: 10; }
        .fix-col-6 { position: sticky !important; left: 375px !important; min-width: 85px; max-width: 95px; background: #fafafa !important; z-index: 10; font-weight: bold; }
        .fix-col-7 { position: sticky !important; left: 460px !important; min-width: 95px; max-width: 105px; background: #f4fce3 !important; z-index: 10; font-weight: bold; color: #2b8a3e; border-right: 2px solid #999 !important; }

        th.fix-col-1, th.fix-col-2, th.fix-col-3, th.fix-col-4, th.fix-col-5, th.fix-col-6, th.fix-col-7 { z-index: 40 !important; text-align: center !important; }

        .type-uni { color: #000000; font-weight: bold; }
        .type-personal { color: #2b8a3e; font-weight: bold; }
        .type-work { color: #1971c2; font-weight: bold; }
        .row-work-bg { background-color: #f8f9fa; }

        .badge-apply { background-color: #12b886; color: white; border: none; border-radius: 3px; padding: 2px 6px; font-size: 10px; font-weight: bold; cursor: pointer; display: inline-block; }
        .badge-apply:hover { background-color: #0ca678; }
        .badge-cancel { background-color: #e74c3c; color: white; border: none; border-radius: 3px; padding: 2px 6px; font-size: 10px; font-weight: bold; cursor: pointer; display: inline-block; }
        .badge-cancel:hover { background-color: #c0392b; }

        .clickable-cell { cursor: pointer; }
        .clickable-cell:hover { background-color: #e8f4fd !important; }

        /* 모달 스타일 */
        .modal-overlay { display: none; position: fixed; z-index: 1000000; left: 0; top: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; }
        .modal-card { background: #fff; padding: 25px; border-radius: 10px; width: 90%; max-width: 450px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); box-sizing: border-box; }
    </style>
    <script>
        document.write('<script src="../config.js?t=' + Date.now() + '"><\/script>');
    </script>
</head>
<body>

<div id="global-navbar"></div>
<script>
    document.write('<script src="../navbar2.js?v=2026_admin_total_time_edit_v18&t=' + Date.now() + '"><\/script>');
</script>

<div class="content">
    <div class="card" style="background-color: #eef2f5; border: 1px solid #ced4da; padding: 12px 20px;">
        <div class="flex-form-row" style="margin-bottom: 0; align-items: center; justify-content: space-between;">
            <div style="display:flex; align-items:center; gap:10px;">
                <label style="color: #2c3e50; font-size: 14px; font-weight: bold;">📅 원장 연월 :</label>
                <select id="filterYear" style="width: 95px; height:36px;"></select>
                <select id="filterMonth" style="width: 75px; height:36px;"></select>
                <input type="date" id="globalUniDate" style="width: 140px; height:36px; margin-left:10px;">
                <span id="loadingStatus" style="font-weight: bold; color: #27ae60; font-size:13px; margin-left:10px;">🔄 실시간 동기화 완료</span>
            </div>
        </div>
    </div>

    <!-- ⚙️ 마스터 제어 콘솔 -->
    <div class="card" id="adminMasterControlCard">
        <h3 style="margin-top:0; margin-bottom:12px; font-size:16px; color:#2c3e50;">⚙️ 마스터 제어 콘솔</h3>
        
        <div class="flex-form-row">
            <div class="form-group">
                <label>새 작업자</label>
                <input type="text" id="newWorkerInput" placeholder="이름 입력" style="width:110px;">
            </div>
            <button class="btn btn-teal" onclick="addWorkerToPool()">명단 추가</button>
            
            <span style="color:#ccc; margin:0 5px;">|</span>

            <div class="form-group">
                <label>새 품목명</label>
                <input type="text" id="newItemInput" placeholder="예: 스포이드(핑크)" style="width:130px;">
            </div>
            <div class="form-group">
                <label>기본 단가</label>
                <input type="number" id="newItemPriceInput" placeholder="원 단위" style="width:90px;">
            </div>
            <button class="btn btn-teal" onclick="addItemPriceMaster()">품목 추가</button>
        </div>

        <div class="flex-form-row" style="margin-top:10px;">
            <div class="form-group">
                <label>💰 시급 및 일괄 정산 - 대상자</label>
                <select id="hourlyWorkerSelect" style="width:120px;"></select>
            </div>
            <div class="form-group">
                <label>시급 설정</label>
                <input type="number" id="hourlyRateInput" value="10500" style="width:100px;">
            </div>
            <button class="btn btn-teal" onclick="saveWorkerHourlyRate()">원장 저장</button>
            
            <button class="btn btn-orange" onclick="applyMonthlyRatesAll(true)">⚡ 당월전체반영</button>
            <button class="btn btn-danger" onclick="applyMonthlyRatesAll(false)">❌ 당월전체미반영</button>
        </div>

        <div class="flex-form-row" style="margin-top:10px; border-top:1px solid #eee; padding-top:10px;">
            <div class="form-group">
                <label>🗑️ 명단/품목 삭제 - 대상자</label>
                <select id="deleteWorkerSelect" style="width:120px;"></select>
            </div>
            <button class="btn btn-teal" onclick="deleteWorkerFromPool()">명단 제거</button>

            <span style="color:#ccc; margin:0 5px;">|</span>

            <div class="form-group">
                <label>삭제 품목</label>
                <select id="deleteItemSelect" style="width:130px;"></select>
            </div>
            <button class="btn btn-teal" onclick="deleteItemFromMaster()">품목 제거</button>
        </div>
    </div>

    <!-- 🛠️ 일일 데이터 입력 등록 -->
    <div class="card">
        <h3 style="margin-top:0; margin-bottom:12px; font-size:16px; color:#2c3e50;">🛠️ 일일 데이터 입력</h3>
        <div class="flex-form-row">
            <div class="form-group">
                <label>작업자</label>
                <select id="entryWorkerSelect" style="width:120px;"></select>
            </div>
            <div class="form-group">
                <label>품목</label>
                <select id="entryItemSelect" style="width:140px;" onchange="updateEntryPriceDisplay()"></select>
            </div>
            <div class="form-group">
                <label>지정단가</label>
                <input type="number" id="entryCostInput" style="width:90px;" readonly style="background:#f1f3f5;">
            </div>
            <div class="form-group">
                <label>수량</label>
                <input type="number" id="entryQtyInput" value="100" style="width:90px;">
            </div>
            <button class="btn" style="background:#2c3e50;" onclick="addDailyRawEntryAdmin()">관리자기록등록</button>
        </div>
    </div>

    <!-- 📊 유니 종합 마스터 정산 원장표 -->
    <div class="card">
        <h3 style="margin-top:0; margin-bottom:12px; font-size:16px; color:#2c3e50;">📊 유니 종합 마스터 정산 원장표</h3>
        
        <div class="table-container">
            <table id="uniMasterPivotTable"></table>
        </div>
    </div>
</div>

<!-- ✏️ 셀 클릭 상세 수정 모달 (출퇴근 시간 텍스트 정밀 수정 포함) -->
<div id="cellEditModal" class="modal-overlay">
    <div class="modal-card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; border-bottom:2px solid #2c3e50; padding-bottom:8px;">
            <h3 style="margin:0; color:#2c3e50;" id="editModalTitle">✏️ 작업 내역 / 출퇴근 시간 수정</h3>
            <span style="cursor:pointer; font-size:20px; font-weight:bold;" onclick="closeCellEditModal()">&times;</span>
        </div>
        
        <input type="hidden" id="editModalWorker">
        <input type="hidden" id="editModalDate">
        <input type="hidden" id="editModalCategory">

        <div id="editModalContent"></div>

        <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:20px;">
            <button class="btn btn-gray" onclick="closeCellEditModal()">취소</button>
            <button class="btn btn-purple" onclick="saveCellEditModalSubmit()">수정 완료</button>
        </div>
    </div>
</div>

<script>
    window.workersPool = [];
    window.itemPrices = {};
    window.rawEntries = [];
    window.hourlyRates = {};
    window.timeEntries = {}; 

    document.addEventListener("DOMContentLoaded", function() {
        var now = new Date();
        var currentYear = now.getFullYear();
        var currentMonth = now.getMonth() + 1;

        var ySel = document.getElementById("filterYear");
        for (var y = currentYear - 2; y <= currentYear + 1; y++) {
            ySel.innerHTML += `<option value="${y}" ${y === currentYear ? 'selected' : ''}>${y}년</option>`;
        }
        var mSel = document.getElementById("filterMonth");
        for (var m = 1; m <= 12; m++) {
            mSel.innerHTML += `<option value="${m}" ${m === currentMonth ? 'selected' : ''}>${m}월</option>`;
        }
        document.getElementById('globalUniDate').value = now.toISOString().split('T')[0];

        ySel.onchange = buildUniMasterPivotTable;
        mSel.onchange = buildUniMasterPivotTable;

        loadUniworkTotalData();
    });

    function loadUniworkTotalData() {
        document.getElementById('loadingStatus').innerText = "🔄 DB 로드 중...";
        var scriptUrl = window.GOOGLE_SCRIPT_URL + (window.GOOGLE_SCRIPT_URL.indexOf('?') > -1 ? '&' : '?') + 't=' + Date.now();
        fetch(scriptUrl)
        .then(r => r.json())
        .then(data => {
            window.workersPool = Array.isArray(data.workersPool) ? data.workersPool : [];
            window.itemPrices = (data.itemPrices && typeof data.itemPrices === 'object') ? data.itemPrices : {};
            window.rawEntries = Array.isArray(data.rawEntries) ? data.rawEntries : [];
            window.hourlyRates = (data.hourlyRates && typeof data.hourlyRates === 'object') ? data.hourlyRates : {};
            window.timeEntries = (data.timeEntries && typeof data.timeEntries === 'object') ? data.timeEntries : {};

            renderUniworkDropdowns();
            buildUniMasterPivotTable();
            document.getElementById('loadingStatus').innerText = "✅ 실시간 동기화 완료";
        })
        .catch(err => {
            document.getElementById('loadingStatus').innerText = "❌ 데이터 로드 지연";
        });
    }

    function syncUniworkWithGoogle(msg) {
        document.getElementById('loadingStatus').innerText = "📤 구글 DB 업데이트 중...";
        var payload = {
            action: "syncAll",
            workersPool: window.workersPool,
            itemPrices: window.itemPrices,
            rawEntries: window.rawEntries,
            hourlyRates: window.hourlyRates,
            timeEntries: window.timeEntries
        };

        fetch(window.GOOGLE_SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify(payload)
        })
        .then(r => r.json())
        .then(() => {
            document.getElementById('loadingStatus').innerText = "✅ DB 저장 완료!";
            buildUniMasterPivotTable();
        })
        .catch(() => {
            document.getElementById('loadingStatus').innerText = "✅ 저장 완료";
            buildUniMasterPivotTable();
        });
    }

    function renderUniworkDropdowns() {
        var wSel = document.getElementById('entryWorkerSelect');
        var hSel = document.getElementById('hourlyWorkerSelect');
        var dWSel = document.getElementById('deleteWorkerSelect');
        var iSel = document.getElementById('entryItemSelect');
        var dISel = document.getElementById('deleteItemSelect');

        if (wSel) wSel.innerHTML = "";
        if (hSel) hSel.innerHTML = "";
        if (dWSel) dWSel.innerHTML = "";
        if (iSel) iSel.innerHTML = "";
        if (dISel) dISel.innerHTML = "";

        window.workersPool.forEach(w => {
            if (wSel) wSel.innerHTML += `<option value="${w}">${w}</option>`;
            if (hSel) hSel.innerHTML += `<option value="${w}">${w}</option>`;
            if (dWSel) dWSel.innerHTML += `<option value="${w}">${w}</option>`;
        });

        for (var itemKey in window.itemPrices) {
            if (iSel) iSel.innerHTML += `<option value="${itemKey}">${itemKey}</option>`;
            if (dISel) dISel.innerHTML += `<option value="${itemKey}">${itemKey}</option>`;
        }

        updateEntryPriceDisplay();
    }

    function updateEntryPriceDisplay() {
        var iSel = document.getElementById('entryItemSelect');
        if (!iSel || !iSel.value) return;
        var itemKey = iSel.value;
        var costInput = document.getElementById('entryCostInput');
        if (costInput) {
            costInput.value = window.itemPrices[itemKey] || 0;
        }
    }

    // 🎯 출/퇴근 시각(HH:MM) 간 시간 차이(시간 단위) 자동 계산
    function calculateHoursBetween(inTimeStr, outTimeStr) {
        if (!inTimeStr || !outTimeStr) return 0;
        try {
            var parseTime = function(tStr) {
                var clean = tStr.replace('오전', '').replace('오후', '').trim();
                var parts = clean.split(':');
                var h = parseInt(parts[0]) || 0;
                var m = parseInt(parts[1]) || 0;
                if (tStr.indexOf('오후') > -1 && h < 12) h += 12;
                if (tStr.indexOf('오전') > -1 && h === 12) h = 0;
                return h * 60 + m;
            };

            var inMin = parseTime(inTimeStr);
            var outMin = parseTime(outTimeStr);
            if (outMin < inMin) outMin += 24 * 60; // 야간 근무 대응

            var diffMin = outMin - inMin;
            return Math.round((diffMin / 60) * 10) / 10; // 소수점 첫째 자리
        } catch(e) {
            return 0;
        }
    }

    function buildUniMasterPivotTable() {
        var table = document.getElementById('uniMasterPivotTable');
        if (!table) return;
        table.innerHTML = "";

        var selYear = parseInt(document.getElementById("filterYear").value);
        var selMonth = parseInt(document.getElementById("filterMonth").value);
        var lastDay = new Date(selYear, selMonth, 0).getDate();

        var dateSet = [];
        var strMonth = selMonth < 10 ? "0" + selMonth : String(selMonth);
        for (var d = 1; d <= lastDay; d++) {
            var strDay = d < 10 ? "0" + d : String(d);
            dateSet.push(selYear + "-" + strMonth + "-" + strDay);
        }

        var headerHtml = `<thead>
            <tr>
                <th class="fix-col-1">이름</th>
                <th class="fix-col-2">구분</th>
                <th class="fix-col-3">품목</th>
                <th class="fix-col-4">단가</th>
                <th class="fix-col-5">📦 금액</th>
                <th class="fix-col-6">총수량 및 시간</th>
                <th class="fix-col-7">📊 최종 합산 총액</th>
                ${dateSet.map(d => `<th style="min-width:70px;">${d.substring(5).replace("-","/")}</th>`).join('')}
            </tr>
        </thead>`;

        var bodyHtml = "<tbody>";

        window.workersPool.forEach(wName => {
            var rateObj = window.hourlyRates[wName] || { rate: 9620 };
            var hourlyRate = rateObj.rate || 9620;

            var adminEntries = window.rawEntries.filter(e => e.name === wName && e.type === 'admin' && e.date && e.date.startsWith(`${selYear}-${strMonth}`));
            var adminTotalQty = 0, adminTotalPay = 0;
            adminEntries.forEach(e => {
                var q = Number(e.qty || 0);
                var c = Number(e.cost || 0);
                adminTotalQty += q;
                adminTotalPay += (q * c);
            });

            var workerEntries = window.rawEntries.filter(e => e.name === wName && e.type === 'worker' && e.date && e.date.startsWith(`${selYear}-${strMonth}`));
            var workerTotalQty = 0;
            workerEntries.forEach(e => { workerTotalQty += Number(e.qty || 0); });

            var workTotalHours = 0;
            dateSet.forEach(d => {
                var tKey = `${wName}_${d}`;
                var tInfo = window.timeEntries[tKey];
                if (tInfo && tInfo.applied) {
                    var h = tInfo.hours || calculateHoursBetween(tInfo.inTime, tInfo.outTime);
                    workTotalHours += Number(h || 0);
                }
            });
            var workTotalPay = Math.round(workTotalHours * hourlyRate);

            var grandTotalPay = adminTotalPay + workTotalPay;

            // Row 1: 유니입력
            var row1 = `<tr>
                <td class="fix-col-1" rowspan="3" style="vertical-align:middle; font-weight:bold; color:#2c3e50;">${wName}</td>
                <td class="fix-col-2 type-uni">유니입력</td>
                <td class="fix-col-3" style="color:#666;">지정품목</td>
                <td class="fix-col-4">0원</td>
                <td class="fix-col-5">${adminTotalPay.toLocaleString()}원</td>
                <td class="fix-col-6">${adminTotalQty.toLocaleString()}개</td>
                <td class="fix-col-7" rowspan="3" style="vertical-align:middle; font-size:14px; color:#2b8a3e;">${grandTotalPay.toLocaleString()}원</td>`;
            
            dateSet.forEach(d => {
                var dayE = adminEntries.filter(e => e.date === d);
                var dayQtySum = 0;
                dayE.forEach(e => { dayQtySum += Number(e.qty || 0); });
                row1 += `<td class="clickable-cell" onclick="openCellEditModal('${wName}', '${d}', 'uni')">${dayQtySum > 0 ? dayQtySum.toLocaleString() : '-'}</td>`;
            });
            row1 += `</tr>`;

            // Row 2: 개인입력
            var row2 = `<tr>
                <td class="fix-col-2 type-personal">개인입력</td>
                <td class="fix-col-3" style="color:#666;">지정품목</td>
                <td class="fix-col-4">-</td>
                <td class="fix-col-5">-</td>
                <td class="fix-col-6">${workerTotalQty.toLocaleString()}개</td>`;
            
            dateSet.forEach(d => {
                var dayE = workerEntries.filter(e => e.date === d);
                var dayQtySum = 0;
                dayE.forEach(e => { dayQtySum += Number(e.qty || 0); });
                row2 += `<td class="clickable-cell" onclick="openCellEditModal('${wName}', '${d}', 'personal')">${dayQtySum > 0 ? dayQtySum.toLocaleString() : '-'}</td>`;
            });
            row2 += `</tr>`;

            // Row 3: 출퇴근확정 (실제 출퇴근 시간 표기 및 반영 버튼)
            var row3 = `<tr class="row-work-bg">
                <td class="fix-col-2 type-work">출퇴근확정</td>
                <td class="fix-col-3" style="color:#1971c2; font-weight:bold;">통합근무</td>
                <td class="fix-col-4" style="color:#1971c2; font-weight:bold;">${hourlyRate.toLocaleString()}원</td>
                <td class="fix-col-5" style="color:#1971c2; font-weight:bold;">${workTotalPay.toLocaleString()}원</td>
                <td class="fix-col-6" style="color:#1971c2; font-weight:bold;">${workTotalHours.toFixed(1)}시간</td>`;
            
            dateSet.forEach(d => {
                var tKey = `${wName}_${d}`;
                var tInfo = window.timeEntries[tKey] || { applied: false, inTime: '', outTime: '', hours: 0 };
                var isApplied = tInfo.applied;
                
                var displayTimeText = "-";
                if (tInfo.inTime || tInfo.outTime) {
                    displayTimeText = `${tInfo.inTime || '?'}~${tInfo.outTime || '?'}`;
                }

                var badgeBtn = isApplied 
                    ? `<button class="badge-apply" onclick="event.stopPropagation(); toggleWorkApply('${wName}', '${d}', false)">반영</button>`
                    : `<button class="badge-cancel" onclick="event.stopPropagation(); toggleWorkApply('${wName}', '${d}', true)">미반영</button>`;

                row3 += `<td class="clickable-cell" onclick="openCellEditModal('${wName}', '${d}', 'work')"><div style="font-size:10px;">${displayTimeText}</div>${badgeBtn}</td>`;
            });
            row3 += `</tr>`;

            bodyHtml += row1 + row2 + row3;
        });

        bodyHtml += "</tbody>";
        table.innerHTML = headerHtml + bodyHtml;
    }

    function applyMonthlyRatesAll(isApply) {
        var targetWorker = document.getElementById('hourlyWorkerSelect').value;
        if (!targetWorker) { alert("대상자를 선택해 주세요."); return; }

        var selYear = parseInt(document.getElementById("filterYear").value);
        var selMonth = parseInt(document.getElementById("filterMonth").value);
        var lastDay = new Date(selYear, selMonth, 0).getDate();
        var strMonth = selMonth < 10 ? "0" + selMonth : String(selMonth);

        var actionText = isApply ? "전체 반영" : "전체 미반영";
        if (confirm(`[${targetWorker}] 작업자의 ${selYear}년 ${selMonth}월 시급을 ${actionText} 하시겠습니까?`)) {
            for (var d = 1; d <= lastDay; d++) {
                var strDay = d < 10 ? "0" + d : String(d);
                var fullDate = `${selYear}-${strMonth}-${strDay}`;
                var tKey = `${targetWorker}_${fullDate}`;

                if (!window.timeEntries[tKey]) {
                    window.timeEntries[tKey] = { inTime: '09:00', outTime: '18:00', hours: 8, applied: isApply };
                } else {
                    window.timeEntries[tKey].applied = isApply;
                }
            }
            syncUniworkWithGoogle(`[${targetWorker}] 당월 시급 ${actionText} 완료`);
        }
    }

    function toggleWorkApply(wName, dateStr, isApply) {
        var tKey = `${wName}_${dateStr}`;
        if (!window.timeEntries[tKey]) {
            window.timeEntries[tKey] = { inTime: '09:00', outTime: '18:00', hours: 8, applied: isApply };
        } else {
            window.timeEntries[tKey].applied = isApply;
        }
        syncUniworkWithGoogle(`[${wName}] ${dateStr} 시급 ${isApply ? '반영' : '미반영'}`);
    }

    // 🎯 [핵심] 관리자 출/퇴근 시각 텍스트 직접 수정 모달 오픈
    function openCellEditModal(wName, dateStr, cat) {
        document.getElementById('editModalWorker').value = wName;
        document.getElementById('editModalDate').value = dateStr;
        document.getElementById('editModalCategory').value = cat;

        var titleText = cat === 'uni' ? '🛠️ 유니입력 수량 수정' : (cat === 'personal' ? '👤 개인입력 수량 수정' : '⏰ 출퇴근 시간 정밀 수정');
        document.getElementById('editModalTitle').innerText = titleText + ` [${wName} - ${dateStr}]`;

        var contentContainer = document.getElementById('editModalContent');
        contentContainer.innerHTML = "";

        if (cat === 'uni' || cat === 'personal') {
            var typeVal = cat === 'uni' ? 'admin' : 'worker';
            var existing = window.rawEntries.filter(e => e.name === wName && e.date === dateStr && e.type === typeVal);
            var currentQty = existing.length > 0 ? existing[0].qty : 0;

            contentContainer.innerHTML = `
                <div class="form-group">
                    <label>작업 수량 입력 (개):</label>
                    <input type="number" id="modalInputQty" value="${currentQty}" style="height:38px; width:100%; border:1px solid #ccc; border-radius:4px; padding:0 10px;">
                </div>
            `;
        } else if (cat === 'work') {
            var tKey = `${wName}_${dateStr}`;
            var tInfo = window.timeEntries[tKey] || { inTime: '오전 09:00', outTime: '오후 18:00', hours: 8 };

            contentContainer.innerHTML = `
                <div style="display:flex; flex-direction:column; gap:12px;">
                    <div class="form-group">
                        <label>출근 시간 기록 (예: 오전 09:00 또는 09:00):</label>
                        <input type="text" id="modalInputInTime" value="${tInfo.inTime || ''}" placeholder="예: 오전 09:00" style="height:38px; width:100%; border:1px solid #ccc; border-radius:4px; padding:0 10px;">
                    </div>
                    <div class="form-group">
                        <label>퇴근 시간 기록 (예: 오후 18:00 또는 18:00):</label>
                        <input type="text" id="modalInputOutTime" value="${tInfo.outTime || ''}" placeholder="예: 오후 18:00" style="height:38px; width:100%; border:1px solid #ccc; border-radius:4px; padding:0 10px;">
                    </div>
                    <p style="font-size:11px; color:#2980b9; margin:0;">* 시간을 수정하면 근무 시간 및 시급 정산액이 자동 계산됩니다.</p>
                </div>
            `;
        }

        document.getElementById('cellEditModal').style.display = 'flex';
    }

    function closeCellEditModal() {
        document.getElementById('cellEditModal').style.display = 'none';
    }

    function saveCellEditModalSubmit() {
        var wName = document.getElementById('editModalWorker').value;
        var dateStr = document.getElementById('editModalDate').value;
        var cat = document.getElementById('editModalCategory').value;

        if (cat === 'uni' || cat === 'personal') {
            var newQty = parseInt(document.getElementById('modalInputQty').value) || 0;
            var typeVal = cat === 'uni' ? 'admin' : 'worker';
            var idx = window.rawEntries.findIndex(e => e.name === wName && e.date === dateStr && e.type === typeVal);

            if (newQty <= 0) {
                if (idx > -1) window.rawEntries.splice(idx, 1);
            } else {
                var itemKey = document.getElementById('entryItemSelect') ? document.getElementById('entryItemSelect').value : "지정품목";
                var costVal = window.itemPrices[itemKey] || 0;
                var entryObj = { date: dateStr, type: typeVal, name: wName, item: itemKey, cost: costVal, qty: newQty };
                
                if (idx > -1) window.rawEntries[idx] = entryObj;
                else window.rawEntries.push(entryObj);
            }
        } else if (cat === 'work') {
            var inTime = document.getElementById('modalInputInTime').value.trim();
            var outTime = document.getElementById('modalInputOutTime').value.trim();
            var calculatedHours = calculateHoursBetween(inTime, outTime);

            var tKey = `${wName}_${dateStr}`;
            if (!window.timeEntries[tKey]) {
                window.timeEntries[tKey] = { inTime: inTime, outTime: outTime, hours: calculatedHours, applied: true };
            } else {
                window.timeEntries[tKey].inTime = inTime;
                window.timeEntries[tKey].outTime = outTime;
                window.timeEntries[tKey].hours = calculatedHours;
            }
        }

        closeCellEditModal();
        syncUniworkWithGoogle(`[${wName}] ${dateStr} 출퇴근 시각 수정 저장`);
    }

    function addWorkerToPool() {
        var name = document.getElementById('newWorkerInput').value.trim();
        if (!name) { alert("작업자 성함을 입력해 주세요!"); return; }

        if (!window.workersPool.includes(name)) {
            window.workersPool.push(name);
            document.getElementById('newWorkerInput').value = "";
            renderUniworkDropdowns();
            syncUniworkWithGoogle("작업자 명단 추가: " + name);
        }
    }

    function deleteWorkerFromPool() {
        var name = document.getElementById('deleteWorkerSelect').value;
        if (!name) return;
        if (confirm(`[${name}] 작업자를 명단에서 삭제하시겠습니까?`)) {
            window.workersPool = window.workersPool.filter(w => w !== name);
            renderUniworkDropdowns();
            syncUniworkWithGoogle("작업자 명단 삭제: " + name);
        }
    }

    function addItemPriceMaster() {
        var name = document.getElementById('newItemInput').value.trim();
        var price = Number(document.getElementById('newItemPriceInput').value) || 0;

        if (!name) { alert("품목명을 입력해 주세요!"); return; }

        window.itemPrices[name] = price;
        document.getElementById('newItemInput').value = "";
        document.getElementById('newItemPriceInput').value = "";

        renderUniworkDropdowns();
        syncUniworkWithGoogle("품목 단가 추가: " + name);
    }

    function deleteItemFromMaster() {
        var name = document.getElementById('deleteItemSelect').value;
        if (!name) return;
        if (confirm(`[${name}] 품목을 삭제하시겠습니까?`)) {
            delete window.itemPrices[name];
            renderUniworkDropdowns();
            syncUniworkWithGoogle("품목 삭제: " + name);
        }
    }

    function saveWorkerHourlyRate() {
        var name = document.getElementById('hourlyWorkerSelect').value;
        var rate = Number(document.getElementById('hourlyRateInput').value) || 0;

        if (!name) return;
        if (!window.hourlyRates[name]) window.hourlyRates[name] = {};
        window.hourlyRates[name].rate = rate;

        syncUniworkWithGoogle(`[${name}] 시급 ${rate}원 저장`);
    }

    function addDailyRawEntryAdmin() {
        var date = document.getElementById('globalUniDate').value;
        var name = document.getElementById('entryWorkerSelect').value;
        var item = document.getElementById('entryItemSelect').value;
        var cost = Number(document.getElementById('entryCostInput').value) || 0;
        var qty = Number(document.getElementById('entryQtyInput').value) || 0;

        if (!date || !name || !item || qty <= 0) {
            alert("날짜, 작업자, 품목, 올바른 수량을 입력해 주세요.");
            return;
        }

        window.rawEntries.push({
            date: date,
            type: 'admin',
            name: name,
            item: item,
            cost: cost,
            qty: qty,
            totalCost: (cost * qty) + "원",
            time: "-"
        });

        syncUniworkWithGoogle(`일일 작업 추가: ${name} (${item} ${qty}개)`);
    }
</script>
</body>
</html>
