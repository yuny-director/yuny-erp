<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YUNY_ERP - 당월 품목별 일별 상세 리포트</title>
    <style>
        html { margin: 0; padding: 0; background-color: #f4f6f9; font-family: Arial, sans-serif; }
        body { margin: 0; padding: 0; padding-top: 65px !important; background-color: #f4f6f9; font-family: Arial, sans-serif; }
        .content { padding: 15px; }
        .card { background-color: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .flex-form-row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; margin-bottom: 15px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { margin-bottom: 6px; font-weight: bold; font-size: 13px; color: #333; }
        .form-group input, .form-group select { padding: 0 10px; border: 1px solid #ccc; border-radius: 4px; height: 38px; box-sizing: border-box; font-size: 13px; background-color: #ffffff; }

        .btn { padding: 0 16px; background-color: #1abc9c; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; height: 38px; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; transition: background 0.2s; box-sizing: border-box; }
        .btn:hover { background-color: #16a085; }
        .btn-orange { background-color: #e67e22 !important; }
        .btn-gray { background-color: #7f8c8d !important; }
        .btn-blue { background-color: #3498db !important; }
        .btn-red { background-color: #e74c3c !important; padding: 0 10px; height: 30px; font-size: 11px; }

        .sort-header { cursor: pointer; user-select: none; }
        .sort-header:hover { background-color: #dbeafe !important; color: #1d4ed8; }

        :root { --item-col-width: 250px; }

        .table-container { width: 100%; max-height: 70vh; overflow: auto; border: 1px solid #ccc; border-radius: 6px; background: white; margin-bottom: 10px; }
        table { border-collapse: separate; border-spacing: 0; font-size: 12px; width: 100%; text-align: center; }
        .table-container th, .table-container td { padding: 8px 6px; border-right: 1px solid #ddd; border-bottom: 1px solid #ddd; white-space: nowrap; box-sizing: border-box; }
        .table-container th { background-color: #f8f9fa; font-weight: bold; position: sticky; top: 0; z-index: 10; }

        .fix-sales-col-1 { position: sticky !important; left: 0px !important; width: var(--item-col-width) !important; min-width: var(--item-col-width) !important; max-width: var(--item-col-width) !important; background: #ffffff !important; z-index: 20; font-weight: bold; white-space: normal !important; word-break: break-all !important; text-align: left !important; padding-left: 12px !important; }
        .fix-sales-col-2 { position: sticky !important; left: var(--item-col-width) !important; width: 70px !important; min-width: 70px !important; background: #ffffff !important; z-index: 20; font-weight: bold; }
        .fix-sales-col-3 { position: sticky !important; left: calc(var(--item-col-width) + 70px) !important; width: 120px !important; min-width: 120px !important; background: #f4fce3 !important; z-index: 20; font-weight: bold; color: #2b8a3e; border-right: 2px solid #2b8a3e !important; }
        th.fix-sales-col-1, th.fix-sales-col-2, th.fix-sales-col-3 { z-index: 30 !important; background-color: #e8f4fd !important; text-align: center !important; }

        .resizer { position: absolute; right: 0; top: 0; width: 6px; cursor: col-resize; user-select: none; height: 100%; background-color: transparent; }
        .resizer:hover { background-color: #3498db; }

        .modal-overlay { display: none; position: fixed; z-index: 1000000; left: 0; top: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; }
        .modal-card { background: #fff; padding: 25px; border-radius: 10px; width: 90%; max-width: 760px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); box-sizing: border-box; }
        .modal-tab-container { display: flex; gap: 4px; border-bottom: 2px solid #3b82f6; margin-bottom: 12px; }
        .modal-tab-btn { padding: 8px 16px; background-color: #f1f5f9; border: none; border-radius: 6px 6px 0 0; cursor: pointer; font-weight: bold; font-size: 12px; color: #64748b; }
        .modal-tab-btn.active { background-color: #3b82f6; color: #ffffff; }
        .modal-table-container table { border-collapse: collapse; }
        .modal-table-container th, .modal-table-container td { position: static !important; padding: 8px; border: 1px solid #cbd5e1; }
        .modal-table-container th { background-color: #f1f5f9 !important; font-weight: bold; color: #1e293b; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script>document.write('<script src="../config.js?t=' + Date.now() + '"><\/script>');</script>
</head>
<body>

<div id="global-navbar"></div>
<script>document.write('<script src="../navbar2.js?v=2026_sales_item_d_v2&t=' + Date.now() + '"><\/script>');</script>

<div class="content">
    <div class="card" style="background-color: #eef2f5; border: 1px solid #ced4da; padding: 12px 20px;">
        <div class="flex-form-row" style="margin-bottom: 0; align-items: center; justify-content: space-between;">
            <div style="display:flex; align-items:center; gap:10px;">
                <label style="color: #2c3e50; font-size: 14px; font-weight: bold;">📅 매출 기준 연월 :</label>
                <select id="filterYear" style="width: 95px; height:36px;"></select>
                <select id="filterMonth" style="width: 75px; height:36px;"></select>
                <span id="loadingStatus" style="font-weight: bold; color: #27ae60; font-size:13px; margin-left:10px;">🔄 실시간 동기화 완료</span>
            </div>
            <div style="display:flex; gap:8px;">
                <button class="btn btn-blue" onclick="openEditMappingModal()">⚙️ 상품 매핑 관리</button>
                <button class="btn btn-orange" onclick="openSalesUploadModal()">📥 쇼핑몰별 매출 파일 업로드</button>
            </div>
        </div>
    </div>

    <div class="card">
        <h3 style="margin-top:0; margin-bottom:12px; font-size:15px; color:#2c3e50;">📅 당월 품목별 누적 합계 & 일별 상세 판매수량/매출 현황</h3>
        <div class="table-container">
            <table id="itemDailyPivotTable"></table>
        </div>
    </div>
</div>

<!-- 매핑 & 업로드 공통 모달 -->
<div id="salesUploadModal" class="modal-overlay"><div class="modal-card"><div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; border-bottom:2px solid #2c3e50; padding-bottom:8px;"><h3 style="margin:0; color:#2c3e50;">📥 쇼핑몰별 매출 파일 업로드</h3><span style="cursor:pointer; font-size:20px; font-weight:bold;" onclick="closeSalesUploadModal()">&times;</span></div><div class="form-group" style="margin-bottom:12px;"><label>1. 업로드할 쇼핑몰(양식) 선택</label><select id="uploadMallType" style="height:38px; font-weight:bold;"><option value="smartstore_confirmed">네이버 스마트스토어 - [구매확정 내역 파일]</option><option value="smartstore_dispatch">네이버 스마트스토어 - [전체주문 발주/발송 관리 파일]</option><option value="coupang">쿠팡 (Coupang)</option><option value="eleven">11번가</option><option value="gmarket">G마켓 / 옥션</option><option value="custom">기타 / 표준 양식</option></select></div><div class="form-group" style="margin-bottom:15px;"><label>2. 매출 데이터 파일 선택 (.xlsx, .xls, .csv)</label><input type="file" id="salesCsvFileInput" accept=".xlsx, .xls, .csv" style="height:auto; padding:8px;"></div><div style="display:flex; justify-content:flex-end; gap:8px; margin-top:20px;"><button class="btn btn-gray" onclick="closeSalesUploadModal()">취소</button><button class="btn btn-orange" onclick="processSalesCsvUpload()">매출 데이터 파싱 & 업로드</button></div></div></div>
<div id="editMappingModal" class="modal-overlay"><div class="modal-card"><div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;"><h3 style="margin:0; color:#1e293b;">⚙️ 쇼핑몰-ERP 품목 연결 매핑 관리</h3><span style="cursor:pointer; font-size:20px; font-weight:bold;" onclick="closeEditMappingModal()">&times;</span></div><div class="modal-tab-container"><button class="modal-tab-btn active" id="modalSubTabUnmapped" onclick="switchModalSubTab('unmapped')">⚠️ 미매핑 수집 품목 매핑 (<span id="unmappedCountBadge">0</span>)</button><button class="modal-tab-btn" id="modalSubTabMapped" onclick="switchModalSubTab('mapped')">✅ 이미 매핑된 품목 관리 (<span id="mappedCountBadge">0</span>)</button></div><div id="modalSubViewUnmapped"><p style="font-size:12px; color:#64748b; margin-bottom:10px;">수집된 매출 데이터 중 아직 ERP 품목과 연결되지 않은 옵션명 목록입니다.</p><div class="modal-table-container" style="max-height:360px; overflow-y:auto; border:1px solid #cbd5e1; border-radius:6px; padding:0; margin-bottom:15px;"><table style="width:100%; font-size:12px;"><thead><tr><th style="width:58%;">쇼핑몰 수집 옵션명</th><th style="width:42%;">연결할 ERP 품목 선택</th></tr></thead><tbody id="unmappedManagerTableBody"></tbody></table></div><div style="display:flex; justify-content:flex-end; gap:8px;"><button class="btn btn-gray" onclick="closeEditMappingModal()">취소</button><button class="btn btn-orange" onclick="saveUnmappedManagerList()">미매핑 연결 저장</button></div></div><div id="modalSubViewMapped" style="display:none;"><p style="font-size:12px; color:#64748b; margin-bottom:10px;">현재 구글 DB에 저장되어 자동으로 연결되는 쇼핑몰 옵션 매핑 목록입니다.</p><div class="modal-table-container" style="max-height:360px; overflow-y:auto; border:1px solid #cbd5e1; border-radius:6px; padding:0; margin-bottom:15px;"><table style="width:100%; font-size:12px;"><thead><tr><th style="width:50%;">쇼핑몰 수집 옵션명</th><th style="width:40%;">매핑된 ERP 품목명</th><th style="width:10%;">삭제</th></tr></thead><tbody id="existingMappingsTableBody"></tbody></table></div><div style="display:flex; justify-content:flex-end; gap:8px;"><button class="btn btn-gray" onclick="closeEditMappingModal()">취소</button><button class="btn btn-blue" onclick="saveEditedMappings()">매핑 수정사항 저장</button></div></div></div></div>

<script src="sales_common.js?v=2026_1"></script>
<script>
    var itemDailySort = { col: 'amt', asc: false };

    document.addEventListener("DOMContentLoaded", function() {
        initSalesPage(renderSalesTables);
    });

    function toggleSort(col) {
        if (itemDailySort.col === col) itemDailySort.asc = !itemDailySort.asc;
        else { itemDailySort.col = col; itemDailySort.asc = false; }
        renderSalesTables();
    }

    function renderSalesTables() {
        var year = parseInt(document.getElementById("filterYear").value);
        var month = parseInt(document.getElementById("filterMonth").value);
        buildItemDailyPivotTable(year, month);
    }

    function buildItemDailyPivotTable(year, month) {
        var table = document.getElementById('itemDailyPivotTable');
        var strM = month < 10 ? "0" + month : String(month);
        var targetPrefix = `${year}${strM}`;
        var monthData = window.salesRawEntries.filter(e => getEntryDate(e).replace(/[^0-9]/g, '').startsWith(targetPrefix));
        var lastDay = new Date(year, month, 0).getDate();
        var dateList = []; for (var d = 1; d <= lastDay; d++) dateList.push(`${year}-${strM}-${d < 10 ? '0'+d : d}`);
        var allItems = Array.from(new Set(monthData.map(e => getEntryItem(e))));

        allItems.sort((a, b) => {
            var qA = 0, sA = 0, qB = 0, sB = 0;
            monthData.filter(e => getEntryItem(e) === a).forEach(e => { qA += getEntryQty(e); sA += getEntryAmt(e); });
            monthData.filter(e => getEntryItem(e) === b).forEach(e => { qB += getEntryQty(e); sB += getEntryAmt(e); });

            if (itemDailySort.col === 'name') return itemDailySort.asc ? a.localeCompare(b) : b.localeCompare(a);
            if (itemDailySort.col === 'qty') return itemDailySort.asc ? qA - qB : qB - qA;
            return itemDailySort.asc ? sA - sB : sB - sA;
        });

        var headerHtml = `<thead><tr>
            <th class="fix-sales-col-1 sort-header" onclick="toggleSort('name')" style="position:relative;">
                품목명 ↕️
                <div class="resizer" onmousedown="initColResize(event)"></div>
            </th>
            <th class="fix-sales-col-2">구분</th>
            <th class="fix-sales-col-3 sort-header" onclick="toggleSort('amt')">${month}월 누적 합계 ↕️</th>
            ${dateList.map(d => `<th>${d.substring(8)}일</th>`).join('')}
        </tr></thead>`;

        var bodyHtml = "<tbody>";
        allItems.forEach(item => {
            var iEntries = monthData.filter(e => getEntryItem(e) === item);
            var mQty = 0, mSales = 0; iEntries.forEach(e => { mQty += getEntryQty(e); mSales += getEntryAmt(e); });

            var row1 = `<tr><td class="fix-sales-col-1" rowspan="2" style="vertical-align:middle; color:#2c3e50;">${item}</td><td class="fix-sales-col-2" style="color:#2980b9;">수량</td><td class="fix-sales-col-3" style="background:#e7f5ff !important; color:#1864ab;">${mQty.toLocaleString()}개</td>`;
            dateList.forEach(d => {
                var dQty = 0; var cleanD = d.replace(/[^0-9]/g, '');
                iEntries.filter(e => getEntryDate(e).replace(/[^0-9]/g, '') === cleanD).forEach(e => dQty += getEntryQty(e));
                row1 += `<td>${dQty > 0 ? dQty.toLocaleString()+'개' : '-'}</td>`;
            });
            row1 += `</tr>`;

            var row2 = `<tr style="border-bottom:2px solid #e2e8f0;"><td class="fix-sales-col-2" style="color:#27ae60;">매출액</td><td class="fix-sales-col-3">${mSales.toLocaleString()}원</td>`;
            dateList.forEach(d => {
                var dSales = 0; var cleanD = d.replace(/[^0-9]/g, '');
                iEntries.filter(e => getEntryDate(e).replace(/[^0-9]/g, '') === cleanD).forEach(e => dSales += getEntryAmt(e));
                row2 += `<td>${dSales > 0 ? dSales.toLocaleString()+'원' : '-'}</td>`;
            });
            row2 += `</tr>`;

            bodyHtml += row1 + row2;
        });

        table.innerHTML = headerHtml + bodyHtml + "</tbody>";
    }

    function initColResize(e) {
        e.preventDefault();
        var startX = e.clientX;
        var startWidth = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--item-col-width')) || 250;
        function onMouseMove(e) {
            var newWidth = Math.max(150, startWidth + (e.clientX - startX));
            document.documentElement.style.setProperty('--item-col-width', newWidth + 'px');
        }
        function onMouseUp() {
            document.removeEventListener('mousemove', onMouseMove);
            document.removeEventListener('mouseup', onMouseUp);
        }
        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseup', onMouseUp);
    }
</script>
</body>
</html>
