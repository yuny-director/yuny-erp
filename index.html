<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YUNY_ERP - 시스템 로그인</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #2c3e50; font-family: Arial, sans-serif; display: flex; align-items: center; justify-content: center; }
        .login-card { background: #ffffff; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); width: 90%; max-width: 380px; text-align: center; box-sizing: border-box; }
        .login-card h2 { margin-top: 0; color: #1abc9c; font-size: 24px; font-weight: bold; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; font-size: 13px; font-weight: bold; color: #333; margin-bottom: 6px; }
        .form-group input { width: 100%; height: 42px; padding: 0 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; box-sizing: border-box; }
        .btn-login { width: 100%; height: 45px; background-color: #1abc9c; color: white; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
        .btn-login:hover { background-color: #16a085; }
        .status-msg { margin-top: 15px; font-size: 12px; font-weight: bold; min-height: 18px; }
    </style>
    <script>
        document.write('<script src="config.js?t=' + Date.now() + '"><\/script>');
    </script>
</head>
<body>

<div class="login-card">
    <h2>YUNY_ERP 로그인</h2>
    <form onsubmit="doLogin(); return false;">
        <div class="form-group">
            <label for="loginId">아이디</label>
            <input type="text" id="loginId" placeholder="아이디 입력" required autocomplete="username">
        </div>
        <div class="form-group">
            <label for="loginPw">비밀번호</label>
            <input type="password" id="loginPw" placeholder="비밀번호 입력" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn-login">로그인</button>
    </form>
    <div id="statusMsg" class="status-msg"></div>
</div>

<script>
function doLogin() {
    var u = document.getElementById('loginId').value.trim();
    var p = document.getElementById('loginPw').value.trim();
    var statusEl = document.getElementById('statusMsg');

    if (!u || !p) { alert("아이디와 비밀번호를 모두 입력해 주세요."); return; }

    statusEl.style.color = "#2980b9";
    statusEl.innerText = "🔄 로그인 확인 중...";

    var scriptUrl = window.GOOGLE_SCRIPT_URL || "";
    var payload = { action: "login", username: u, password: p };

    fetch(scriptUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(payload)
    })
    .then(r => r.json())
    .then(res => {
        if (res.result === "success") {
            localStorage.setItem('login_user_name', res.name || u);
            localStorage.setItem('login_user_role', res.role || "worker");
            localStorage.setItem('login_user_permissions', JSON.stringify(res.permissions || {}));

            statusEl.style.color = "#27ae60";
            statusEl.innerText = "✅ 로그인 성공! 페이지 이동 중...";
            
            setTimeout(function() {
                window.location.href = "dashboard/dashboard.html";
            }, 300);
        } else {
            statusEl.style.color = "#e74c3c";
            statusEl.innerText = "❌ " + (res.message || "로그인 실패");
        }
    })
    .catch(err => {
        statusEl.style.color = "#e74c3c";
        statusEl.innerText = "❌ 서버 통신 오류가 발생했습니다.";
    });
}
</script>

</body>
</html>
